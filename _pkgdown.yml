url: https://openalexpro.github.io/openalexSnapshot

template:
  bootstrap: 5

home:
  title: "openalexSnapshot -- OpenAlex Bulk Snapshot Tools"
  description: "Index and query the OpenAlex Parquet snapshot, including an offline view of the citation graph."

navbar:
  left:
    - icon: fa-home
      href: index.html
    - text: "Get Started"
      href: articles/snapshot-workflow.html
    - text: "Articles"
      menu:
        - text: "Snapshot Workflow"
          href: articles/snapshot-workflow.html
    - text: "Reference"
      href: reference/index.html
    - text: "Changelog"
      href: news/index.html

reference:
  - title: "Snapshot Processing"
    desc: "Building and querying ID indexes over a local Parquet corpus."
    contents:
      - build_corpus_index
      - lookup_by_id
  - title: "Offline Citation Graph"
    desc: "Indexes and queries that make the citation graph available without network access."
    contents:
      - build_citation_index
      - build_doi_index
      - get_citing
      - get_cited
      - doi_to_id
      - lookup_by_doi

  - title: "Package"
    contents:
